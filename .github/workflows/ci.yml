name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'schemas/**'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'schemas/**'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed test domains
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/module3_fuzzing/**'
              - '.github/workflows/ci.yml'
            python:
              - 'src/**/*.py'
              - 'tests/**'
              - 'schemas/**'
              - 'requirements.txt'
              - '.github/workflows/ci.yml'

  python-tests:
    name: Python offline tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ''
      NVIDIA_API_KEY: ''
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run primary offline Python tests
        run: pytest -q tests

  rust-tests:
    name: Rust Module 3 tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/module3_fuzzing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/module3_fuzzing
      - name: Install solc 0.8.20 (official static build, sha256-checked)
        run: |
          mkdir -p "$HOME/solc-bin"
          curl -sSfL -o "$HOME/solc-bin/solc" https://github.com/ethereum/solidity/releases/download/v0.8.20/solc-static-linux
          echo "0479d44fdf9c501c25337fdc540419f1593b884a87b47f023da4f1c700fda782  $HOME/solc-bin/solc" | sha256sum -c -
          chmod +x "$HOME/solc-bin/solc"
          echo "$HOME/solc-bin" >> "$GITHUB_PATH"
      - name: Run Rust tests (fixture tests fail if solc 0.8.20 is missing)
        run: |
          solc --version
          cargo test --all-targets
